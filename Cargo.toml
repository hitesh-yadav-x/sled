[package]
name = "session-ledger"
version = "0.1.0"
edition = "2021"
description = "A local ledger of your Claude Code sessions: tokens, estimated cost, notes, and a resume command."
repository = "https://github.com/hitesh-yadav-x/sled"
readme = "README.md"
license = "MIT"

[lib]
name = "session_ledger"
path = "src/lib.rs"

[[bin]]
name = "sled"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tiny_http = "0.12.0"
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
ureq = "3.5.2"
