<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" role="img" aria-labelledby="t d">
  <title id="t">How sled records a Claude Code session</title>
  <desc id="d">Claude Code session events run sled hook, which reads the new lines of the session files and updates ledger.db. sled sweep reads every session file into the same ledger. sled serve shows the ledger on a page on your own machine.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8B8B92"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#A996FF"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .group { font-size: 13px; fill: #8B8B92; letter-spacing: .02em; }
    .name { font-size: 16px; font-weight: 600; fill: #F3F3F4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    .sub { font-size: 12.5px; fill: #8B8B92; }
    .lab { font-size: 12px; fill: #B9B9C0; }
    .node { fill: #151516; stroke: #2E2E33; }
    .panel { fill: #1D1D1F; stroke: #262629; }
    .flow { fill: none; stroke: #8B8B92; stroke-width: 1.5; }
    .read { stroke-dasharray: 5 5; }
  </style>

  <rect x=".5" y=".5" width="879" height="729" rx="18" fill="#0D0D0E" stroke="#262629"/>

  <!-- Claude Code -->
  <rect class="panel" x="40" y="36" width="800" height="134" rx="14"/>
  <text class="group" x="60" y="64">Claude Code</text>
  <rect class="node" x="60" y="82" width="340" height="68" rx="12"/>
  <text class="name" x="230" y="111" text-anchor="middle">Session events</text>
  <text class="sub" x="230" y="132" text-anchor="middle">a session starts, a reply finishes, a session ends</text>
  <rect class="node" x="480" y="82" width="340" height="68" rx="12"/>
  <text class="name" x="650" y="111" text-anchor="middle">Session files</text>
  <text class="sub" x="650" y="132" text-anchor="middle">one .jsonl per session, plus its sub-agent files</text>

  <!-- sled -->
  <rect class="panel" x="40" y="232" width="800" height="348" rx="14"/>
  <text class="group" x="60" y="260">sled</text>
  <rect class="node" x="60" y="276" width="340" height="68" rx="12"/>
  <text class="name mono" x="230" y="305" text-anchor="middle">sled hook</text>
  <text class="sub" x="230" y="326" text-anchor="middle">reads only the lines added since its last run</text>
  <rect class="node" x="480" y="276" width="340" height="68" rx="12"/>
  <text class="name mono" x="650" y="305" text-anchor="middle">sled sweep</text>
  <text class="sub" x="650" y="326" text-anchor="middle">reads every session file; run by sled install</text>
  <rect class="node" x="270" y="382" width="340" height="68" rx="12"/>
  <text class="name mono" x="440" y="411" text-anchor="middle">ledger.db</text>
  <text class="sub" x="440" y="432" text-anchor="middle">one row per session; each message counted once</text>
  <rect class="node" x="270" y="492" width="340" height="68" rx="12"/>
  <text class="name mono" x="440" y="521" text-anchor="middle">sled serve</text>
  <text class="sub" x="440" y="542" text-anchor="middle">answers on 127.0.0.1 only</text>

  <!-- page -->
  <rect x="270" y="622" width="340" height="68" rx="34" fill="#151516" stroke="#A996FF" stroke-width="1.5"/>
  <text class="name" x="440" y="651" text-anchor="middle">Ledger page in your browser</text>
  <text class="sub" x="440" y="672" text-anchor="middle">search, add notes, copy a resume command</text>

  <!-- flows -->
  <path class="flow" d="M230 150V274" marker-end="url(#a)"/>
  <text class="lab" x="218" y="197" text-anchor="end">hook event on stdin:</text>
  <text class="lab" x="218" y="213" text-anchor="end">session id and file path</text>

  <path class="flow read" d="M560 150v39a10 10 0 0 1-10 10H340a10 10 0 0 0-10 10V274" marker-end="url(#a)"/>
  <text class="lab" x="445" y="190" text-anchor="middle">titles, prompts, token counts</text>

  <path class="flow read" d="M700 150V274" marker-end="url(#a)"/>
  <text class="lab" x="712" y="205">every file</text>

  <path class="flow" d="M230 344v62a10 10 0 0 0 10 10H268" marker-end="url(#a)"/>
  <path class="flow" d="M650 344v62a10 10 0 0 1-10 10H612" marker-end="url(#a)"/>
  <path class="flow" d="M440 450V490" marker-end="url(#a)"/>
  <path class="flow" d="M440 560V620" stroke="#A996FF" marker-end="url(#b)"/>
  <text class="lab mono" x="454" y="606" style="font-size:12px">http://127.0.0.1:7878</text>

  <!-- key -->
  <path class="flow" d="M60 704H92"/>
  <text class="lab" x="100" y="708">writes or triggers</text>
  <path class="flow read" d="M232 704H264"/>
  <text class="lab" x="272" y="708">reads</text>
</svg>
